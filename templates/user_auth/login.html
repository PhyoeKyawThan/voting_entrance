{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Scan</title>
    
    {% tailwind_css %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Smooth scale on focus instead of translate for cleaner UI */
        .input:focus { transform: scale(1.01); }
        .transition-all { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-base-200 text-base-content selection:bg-primary selection:text-white">

    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full py-12">
            
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-primary text-primary-content shadow-xl shadow-primary/20 mb-6 transform hover:rotate-3 transition-all duration-300">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 003.5 11c0-5.523 4.477-10 10-10s10 4.477 10 10a9.985 9.985 0 01-2.423 6.57l-.084.11m-6.563-5.658l1.174 2.015m-1.214-1.822a3 3 0 11-1.173 4.973" />
                    </svg>
                </div>
                <h1 class="text-4xl font-black tracking-tight text-neutral">Admin Login</h1>
                <p class="text-base-content/60 mt-2 font-medium">Smart Scan Management System</p>
            </div>

            <div class="card bg-base-100 shadow-2xl border border-base-300">
                <form method="POST" class="card-body p-8 gap-6">
                    {% csrf_token %}

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-bold text-xs uppercase tracking-widest opacity-70">Username</span>
                        </label>
                        <div class="relative">
                            <span class="absolute z-50 inset-y-0 left-0 pl-4 flex items-center text-base-content/40">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            </span>
                            <input type="text" 
                                   name="username" 
                                   placeholder="e.g. phyoe_admin" 
                                   class="input input-bordered w-full pl-12 bg-base-100 border-base-300 focus:input-primary transition-all font-medium placeholder:text-base-content/30" 
                                   required 
                                   autofocus />
                        </div>
                    </div>

                    <div class="form-control">
                        <div class="flex justify-between items-end mb-2">
                            <label class="label p-0">
                                <span class="label-text font-bold text-xs uppercase tracking-widest opacity-70">Password</span>
                            </label>
                            <a href="#" class="text-xs link link-hover text-primary font-bold">Forgot?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute z-50 inset-y-0 left-0 pl-4 flex items-center text-base-content/40">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                            </span>
                            <input type="password" 
                                   id="passwordInput"
                                   name="password" 
                                   placeholder="••••••••" 
                                   class="input input-bordered w-full pl-12 bg-base-100 border-base-300 focus:input-primary transition-all placeholder:text-base-content/30" 
                                   required />
                            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-base-content/40 hover:text-primary transition-colors">
                                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path id="eyePath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="label cursor-pointer gap-3">
                            <input type="checkbox" class="checkbox checkbox-primary checkbox-sm rounded-md" />
                            <span class="label-text font-medium opacity-80">Remember this session</span>
                        </label>
                    </div>

                    {% if error %}
                    <div class="alert alert-error rounded-xl py-3 border-none shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span class="text-sm font-bold text-white">{{ error }}</span>
                    </div>
                    {% endif %}

                    <div class="form-control mt-4">
                        <button type="submit" class="btn btn-primary btn-lg text-white font-black uppercase tracking-widest rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/40 transition-all border-none">
                            Login
                        </button>
                    </div>
                </form>
            </div>

            <div class="text-center mt-12 space-y-4">
                <p class="text-[10px] font-bold text-base-content/40 uppercase tracking-[0.3em]">
                    &copy; 2026 Smart Scan IoT Systems
                </p>
                <div class="flex justify-center gap-4 text-xs font-semibold opacity-50">
                    <a href="#" class="hover:text-primary transition-colors">Security Policy</a>
                    <span class="opacity-20">•</span>
                    <a href="#" class="hover:text-primary transition-colors">System Status</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const path = document.getElementById('eyePath');
            if (input.type === "password") {
                input.type = "text";
                // Adds the "slash" to the eye icon
                path.setAttribute('d', 'M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18');
            } else {
                input.type = "password";
                // Resets to normal eye
                path.setAttribute('d', 'M15 12a3 3 0 11-6 0 3 3 0 016 0z');
            }
        }
    </script>
</body>
</html>
