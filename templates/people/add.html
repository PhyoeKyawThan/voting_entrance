{% extends 'base.html' %} {% block title %} Add New Student | Secure Voting System {% endblock %} {% block content %}
<div class="max-w-4xl mx-auto">
  <div class="text-sm breadcrumbs mb-6">
    <ul>
      <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
      <li><a href="{% url 'people.index' %}">People</a></li>
      <li class="text-primary font-bold">Add New</li>
    </ul>
  </div>

  <div class="card bg-base-100 shadow-xl border border-base-300">
    <div class="card-body">
      <div class="flex items-center gap-4 mb-6">
        <div class="p-3 bg-primary/10 rounded-full text-primary">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
            />
          </svg>
        </div>
        <h2 class="card-title text-2xl">Registration Form</h2>
      </div>

      <form method="POST" action="" class="space-y-6" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-control w-full">
            <label class="label"
              ><span class="label-text font-semibold">Full Name</span></label
            >
            <input
              type="text"
              name="name"
              placeholder="e.g. Mg Mg"
              class="input input-bordered w-full focus:input-primary"
              required
            />
          </div>

          <div class="form-control w-full">
            <label class="label"
              ><span class="label-text font-semibold"
                >Father's Name</span
              ></label
            >
            <input
              type="text"
              name="father_name"
              placeholder="Enter father's name"
              class="input input-bordered w-full focus:input-primary"
              required
            />
          </div>

          <div class="form-control w-full">
            <label class="label"
              ><span class="label-text font-semibold"
                >NRC / Identity Number</span
              ></label
            >
            <input
              type="text"
              name="nrc"
              placeholder="12/YAKANA(N)123456"
              class="input input-bordered w-full focus:input-primary"
              required
            />
          </div>
        </div>

        <div class="divider text-xs uppercase opacity-50">Contact</div>
          <div class="form-control w-full md:col-span-2">
            <label class="label"
              ><span class="label-text font-semibold">Home Address</span></label
            >
            <textarea
              name="address"
              class="textarea textarea-bordered h-24 focus:textarea-primary"
              placeholder="Enter full permanent address"
              required
            ></textarea>
          </div>

          <div class="form-control w-full md:col-span-2">
            <label class="label"
              ><span class="label-text font-semibold">Picture</span></label
            >
            <div class="form-control items-center space-y-4">
              <label class="label">
                <span class="label-text font-bold">Person Photo</span>
              </label>

              <div class="avatar group">
                <label
                  for="picture"
                  class="relative w-32 h-32 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2 cursor-pointer overflow-hidden bg-base-300 transition-all hover:ring-primary-focus"
                >
                  <img
                    id="previewImage"
                    src="{{ people.picture.url|default:'' }}"
                    class="w-full h-full object-cover {% if not people.picture %}hidden{% endif %}"
                    alt="Preview"
                  />

                  <div
                    id="placeholder"
                    class="flex flex-col items-center justify-center w-full h-full {% if people.picture %}hidden{% endif %}"
                  >
                    <svg
                      class="w-8 h-8 opacity-40"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 4v16m8-8H4"
                      ></path>
                    </svg>
                    <span class="text-[10px] uppercase font-bold opacity-40"
                      >Upload</span
                    >
                  </div>

                  <div
                    class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                  >
                    <svg
                      class="w-6 h-6 text-white"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                    </svg>
                  </div>
                </label>

                <input
                  type="file"
                  name="picture"
                  id="picture"
                  accept="image/*"
                  class="hidden"
                  onchange="previewFile(this)"
                />
              </div>

              <p class="text-[10px] opacity-50">
                Click photo to change (Max 2MB)
              </p>
            </div>
          </div>
        </div>

        <div
          class="card-actions justify-end mt-8 pt-6 border-t border-base-300"
        >
          <button type="button" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary px-8 text-white">
            <svg
              class="w-4 h-4 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  function previewFile(input) {
    const file = input.files[0];
    const preview = document.getElementById("previewImage");
    const placeholder = document.getElementById("placeholder");

    if (file) {
      const reader = new FileReader();

      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.classList.remove("hidden");
        placeholder.classList.add("hidden");
      };

      reader.readAsDataURL(file);
    }
  }
</script>
{% endblock %}
