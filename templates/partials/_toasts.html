{% if messages %}
<div class="toast toast-end toast-top z-[100]">
  {% for message in messages %}
  <div
    class="alert {% if message.tags == 'success' %}alert-success text-white{% elif message.tags == 'error' %}alert-error text-white{% else %}alert-info{% endif %} shadow-lg"
  >
    <div>
      {% if message.tags == 'success' %}
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="stroke-current flex-shrink-0 h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      {% endif %}
      <span>{{ message }}</span>
    </div>
  </div>
  {% endfor %}
</div>

<script>
  setTimeout(() => {
    const toasts = document.querySelectorAll(".toast");
    toasts.forEach((t) => t.classList.add("hidden"));
  }, 4000);
</script>
{% endif %}
