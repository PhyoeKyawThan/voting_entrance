# Production override. Use with the base compose file:
#   cp .env.example .env   # then edit secrets and ALLOWED_HOSTS
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# App is served at http://localhost (or HTTP_PORT from .env) via nginx.
# MySQL and Redis are not exposed to the host.

services:
  web:
    ports: []
    expose:
      - "8000"
    environment:
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  db:
    ports: []

  redis:
    ports: []

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  static_data:
